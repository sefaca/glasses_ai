name: Growth rank tracker semanal

on:
  schedule:
    # Lunes 05:00 UTC (07:00 Madrid), para tener el informe antes de empezar.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar snapshot (GSC + competidores)
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
        run: node growth/tracker.mjs

      - name: Commitear snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add growth/snapshots
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "chore(growth): snapshot semanal del rank tracker $(date -u +%F)"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "push $i fallo (main avanzo), reintentando..."; sleep 5
            done
          fi
